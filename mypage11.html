<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 9. general sibling selector */
      /* s1 ~ s2 ความหมายคือ s2 ทั้งหมดที่อยู่ตภายใต้ s1 */
      #aa ~ p {
        color: rgb(106, 199, 0);
      }
    </style>
  </head>
  <body>
    <h1>Welcome to DTI-SAU (11)</h1>
    <div id="aa">
      <p>11111</p>
      <p>22222</p>
      <span>Hello</span>
      <div id="bb">
        <p>33333</p>
        <div id="cc">
          <p>4444</p>
        </div>
        <span>Hi</span>
      </div>
      <p>55555</p>
    </div>
    <p>66666</p>
    <p>77777</p>
    <span>Hey</span>
    <p>88888</p>
  </body>
</html>
