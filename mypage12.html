<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 10.pseudo-element selector -> S::?????*/
        h1::first-letter {
        color: rgb(255, 0, 0);
        font-size: 50px;
      }
      /* 11.pseudo-class selector -> S:?????? */
        a:hover {
        background-color: rgb(120, 152, 255);
        font-size: 15px;
      }   

      /* 12.attribute selector */
      input[type="text"] {
        background-color: rgb(186, 255, 221);
      }
      input[type="password"] {
        background-color: rgb(255, 186, 186);
      }
      input::placeholder {
        color: rgb(0, 0, 0);
      }
    </style>
  </head>
  <body>
    <h1>Welcome to DTI-SAU (12)</h1>
    <a href="https://www.youtube.com">YouTube</a>
    <br /><br />

    <input type="text" name="" id="" placeholder="กรอกชื่อของคุณ" />
    <br /><br />
    <label for="">นามสกุล</label>
    <input type="text" name="" id="" placeholder="กรอกนามสกุลของคุณ" />
    <br /><br />
    <label for="">รหัสผ่าน</label>
    <input type="password" name="" id="" placeholder="กรอกรหัสผ่าน" />
    <br /><br />
    <input type="submit" value="ตกลง"  />
    <input type="reset"  value="ยกเลิก" />
  </body>
</html>
